name: Android build

# Builds the Android app on GitHub's servers, so no Android Studio is needed.
# - Always: a debug APK you can install on a phone for testing.
# - If the signing secrets exist: a signed release AAB to upload to Google Play.
#   Secrets (repo Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
permissions:
  contents: write   # to publish the test APK on the "android-test" release page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "ml/**", "docs/**"]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          # Microphone for "Speak to log"
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
          # Version: build number from the GitHub run, so every upload is higher
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build debug APK (for testing on a phone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rozanapay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publish the test APK on a fixed release page so it can be downloaded
      # straight onto a phone (artifacts above need a GitHub login).
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RozanaPay-test.apk
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --prerelease --title "RozanaPay test app (Android)" \
              --notes "Test build for pilot users. Not for Google Play. Updated automatically on every change."
          gh release upload android-test RozanaPay-test.apk --clobber

      - name: Build signed release AAB (for Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: rozanapay-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
